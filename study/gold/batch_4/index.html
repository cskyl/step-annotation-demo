const u8 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function openPage(pass) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name: 'PBKDF2', salt: u8(B.salt), iterations: B.iter, hash: 'SHA-256'},
    base, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({name: 'AES-GCM', iv: u8(B.iv)}, key, u8(B.ct));
  const html = new TextDecoder().decode(plain);
  try { sessionStorage.setItem('study_pass', pass); } catch (e) {}
  document.open(); document.write(html); document.close();
}
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const m = document.getElementById('msg'); m.textContent = 'Opening… / 正在打开…';
  try { await openPage(document.getElementById('p').value.trim()); }
  catch (err) { m.textContent = 'Wrong passphrase / 口令不对'; }
});
// One-click link: a passphrase after '#k=' in the URL opens the page; the fragment never reaches the server.
const fromLink = (/[#&]k=([^&]+)/.exec(location.hash) || [])[1];
if (fromLink) { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
let saved = fromLink ? decodeURIComponent(fromLink) : null;
if (!saved) { try { saved = sessionStorage.getItem('study_pass'); } catch (e) {} }
if (saved) openPage(saved).catch(() => { document.getElementById('msg').textContent = 'Link did not open the page; enter the passphrase. / 链接未能打开，请输入口令。'; });
